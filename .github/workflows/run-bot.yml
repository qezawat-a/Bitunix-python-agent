name: Run Bot (Manual)

# Manual trigger - you click a button to run it
on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'How long to run (minutes)'
        required: false
        default: '30'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Create .env from secrets
        run: |
          cat > .env << 'ENV_EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_IDS=${{ secrets.TELEGRAM_ADMIN_IDS }}
          AI_BASE_URL=${{ secrets.AI_BASE_URL }}
          AI_API_KEY=${{ secrets.AI_API_KEY }}
          AI_MODEL=AUTO
          BITUNIX_API_KEY=${{ secrets.BITUNIX_API_KEY }}
          BITUNIX_SECRET_KEY=${{ secrets.BITUNIX_SECRET_KEY }}
          BITUNIX_BASE_URL=https://fapi.bitunix.com
          BITUNIX_WS_PUBLIC=wss://fapi.bitunix.com/public/
          BITUNIX_WS_PRIVATE=wss://fapi.bitunix.com/private/
          DEFAULT_SYMBOL=BTCUSDT
          DEFAULT_LEVERAGE=10
          RISK_PERCENT=2.0
          PAPER_TRADING=true
          NEON_DATABASE_URL=${{ secrets.NEON_DATABASE_URL }}
          LOG_LEVEL=INFO
          LOG_FILE=./logs/agent.log
          ENV_EOF
      
      - name: Run Bot
        run: |
          python3 run.py
        timeout-minutes: 360
